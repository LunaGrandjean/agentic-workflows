[project]
name = "agentic-workflows"
version = "0.1.0"
description = "Kubeflow workflows for Phi-3 LoRA fine-tuning and Yoda translation evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=4.1.1,<6",
    "gcsfs>=2025.9.0,<2026.8.0",
    "google-cloud-aiplatform>=2.3.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.16.0",
    "kfp>=2.14.6",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-workflows = "agentic_workflows:main"

[project.optional-dependencies]
training = [
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.45.5,<0.49 ; sys_platform != 'darwin'",
    "peft==0.13.2",
    "tensorboard>=2.18,<3",
    "torch==2.8.0",
    "transformers==4.46.3",
    "trl==0.12.2",
]
evaluation = [
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "ragas==0.2.15",
    "rouge-score==0.1.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6,<7",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
